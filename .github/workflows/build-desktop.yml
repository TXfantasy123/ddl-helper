name: Build Windows Installer

# 触发方式：
#   1) 手动：仓库 Actions 页面 → 选这个 workflow → Run workflow
#   2) 打标签：git tag v2.12.0 && git push origin v2.12.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (desktop)
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # --publish never：只本地生成产物（含 latest.yml），发布交给下一步
      - name: Build installer
        working-directory: desktop
        run: npm run dist:ci

      # 另存一份中文名，方便手动下载时辨认（自动更新用的是 ASCII 名那份）
      - name: Duplicate with Chinese name
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter "DDLHelper-Setup-*.exe" | Select-Object -First 1
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item $exe.FullName ("release/DDL小管家-安装程序-v$ver.exe")
          dir release

      - name: List output
        working-directory: desktop
        run: dir release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDL小管家-installer
          path: |
            desktop/release/*.exe
            desktop/release/*.yml
          if-no-files-found: error

      # 打标签时创建 Release：exe + latest.yml（软件内更新必需）
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.yml
          name: DDL小管家 ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
