name: Build Windows Installer

# 触发方式：
#   1) 手动：仓库 Actions 页面 → 选这个 workflow → Run workflow
#   2) 打标签：git tag v2.9.0 && git push origin v2.9.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (desktop)
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installer
        working-directory: desktop
        run: npm run dist

      - name: List output
        working-directory: desktop
        run: dir release

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDL小管家-installer
          path: desktop/release/*.exe
          if-no-files-found: error

      # 打标签时自动创建 Release 并附上 exe，方便直接发给别人
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          name: DDL小管家 ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
